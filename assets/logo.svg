<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#blueGrad)" filter="url(#glow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Modern Key Silhouette in Silver / White -->
  <!-- Key Head (Bow) -->
  <circle cx="24" cy="24" r="12" stroke="url(#silverGrad)" stroke-width="4.5" />
  <circle cx="24" cy="24" r="4.5" fill="url(#silverGrad)" />

  <!-- Key Shaft -->
  <path d="M33 33 L49 49" stroke="url(#silverGrad)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Key Teeth / Bits -->
  <path d="M42 42 L46 38" stroke="url(#silverGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M46 46 L50 42" stroke="url(#silverGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Precision Cutout Notch -->
  <circle cx="24" cy="24" r="2.5" fill="#1D4ED8" />
</svg>
