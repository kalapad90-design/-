<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="smartShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="20" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="75%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="bodyBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B2D42"/>
      <stop offset="40%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#0F1117"/>
    </linearGradient>
  </defs>

  <g filter="url(#smartShadow)">
    <!-- Chrome Trim Edge -->
    <rect x="340" y="140" width="320" height="345" rx="70" fill="url(#chromeTrim)" stroke="#64748B" stroke-width="1.5"/>
    <!-- Black Soft-Touch Case -->
    <rect x="348" y="148" width="304" height="329" rx="62" fill="url(#bodyBlack)"/>

    <!-- Keyless Top Hook -->
    <path d="M470 148 L470 125 C470 115 530 115 530 125 L530 148 Z" fill="url(#chromeTrim)"/>
    <circle cx="500" cy="132" r="6" fill="#FFFFFF"/>

    <!-- Lock Button -->
    <rect x="390" y="185" width="220" height="65" rx="14" fill="#242833" stroke="#374151" stroke-width="1.5"/>
    <svg x="485" y="198" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <!-- Unlock Button -->
    <rect x="390" y="265" width="220" height="65" rx="14" fill="#242833" stroke="#374151" stroke-width="1.5"/>
    <svg x="485" y="278" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#CBD5E1" stroke-width="2">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
    </svg>

    <!-- Trunk Button -->
    <rect x="390" y="345" width="105" height="55" rx="12" fill="#242833" stroke="#374151" stroke-width="1.5"/>
    <text x="442" y="378" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">HOLD</text>

    <!-- Panic Red Button -->
    <rect x="505" y="345" width="105" height="55" rx="12" fill="#7F1D1D" stroke="#DC2626" stroke-width="1.5"/>
    <text x="557" y="378" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FCA5A5" text-anchor="middle">PANIC</text>

    <!-- Indicator LED -->
    <circle cx="500" cy="168" r="3.5" fill="#EF4444"/>
    <circle cx="500" cy="168" r="1.5" fill="#FFFFFF"/>

    <!-- Brand Emblem Accent -->
    <circle cx="500" cy="435" r="16" fill="url(#chromeTrim)"/>
    <circle cx="500" cy="435" r="13" fill="#1E293B"/>
    <path d="M493 435 L507 435 M500 428 L500 442" stroke="url(#chromeTrim)" stroke-width="2"/>
  </g>
</svg>
