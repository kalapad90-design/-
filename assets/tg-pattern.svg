<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <defs>
    <!-- Key Definition -->
    <g id="doodle-key">
      <path d="M25,25 m-12,0 a12,12 0 1,0 24,0 a12,12 0 1,0 -24,0" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="25" cy="25" r="4" fill="#2563EB"/>
      <path d="M34,34 L56,56 L51,61 L45,55 L41,59 L36,54" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Lock Definition -->
    <g id="doodle-lock">
      <circle cx="25" cy="32" r="15" fill="none" stroke="#475569" stroke-width="3.5"/>
      <path d="M17,21 V14 A8,8 0 0,1 33,14 V21" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="25" cy="30" r="2.8" fill="#475569"/>
      <polygon points="23.5,30 26.5,30 27.5,38 22.5,38" fill="#475569"/>
    </g>

    <!-- Clock Definition -->
    <g id="doodle-clock">
      <circle cx="25" cy="25" r="18" fill="none" stroke="#2563EB" stroke-width="3.5"/>
      <polyline points="25,13 25,25 34,30" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Star / Sparkle Accent -->
    <g id="doodle-sparkle">
      <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#94A3B8"/>
    </g>
  </defs>

  <!-- Scattered Tiled Icons (Telegram Chat Wallpaper Style) -->
  <!-- Top Row -->
  <use href="#doodle-key" transform="translate(18, 12) rotate(-18 25 25) scale(0.65)" opacity="0.16"/>
  <use href="#doodle-lock" transform="translate(145, 10) rotate(12 25 25) scale(0.68)" opacity="0.15"/>
  <use href="#doodle-sparkle" transform="translate(95, 28) scale(1.1)" opacity="0.18"/>
  <circle cx="120" cy="18" r="1.5" fill="#64748B" opacity="0.2"/>

  <!-- Center Row -->
  <use href="#doodle-clock" transform="translate(80, 75) rotate(-6 25 25) scale(0.65)" opacity="0.16"/>
  <use href="#doodle-sparkle" transform="translate(30, 95) scale(0.9)" opacity="0.16"/>
  <circle cx="48" cy="115" r="1.5" fill="#2563EB" opacity="0.2"/>
  <circle cx="185" cy="85" r="2" fill="#64748B" opacity="0.18"/>

  <!-- Bottom Row -->
  <use href="#doodle-lock" transform="translate(15, 145) rotate(15 25 25) scale(0.66)" opacity="0.15"/>
  <use href="#doodle-key" transform="translate(142, 138) rotate(32 25 25) scale(0.65)" opacity="0.16"/>
  <use href="#doodle-clock" transform="translate(175, 62) rotate(18 25 25) scale(0.55)" opacity="0.14"/>
  <use href="#doodle-sparkle" transform="translate(110, 175) scale(1.2)" opacity="0.2"/>
  <circle cx="85" cy="145" r="1.5" fill="#2563EB" opacity="0.18"/>
</svg>
