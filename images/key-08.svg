<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="dallasShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dallasContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Металл таблетки iButton (сталь полированная) -->
    <radialGradient id="steelDisc" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="90%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </radialGradient>
    <linearGradient id="holderBlack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="ringSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <g filter="url(#dallasShadow)">
    <g filter="url(#dallasContact)">
      <!-- Стальное заводное кольцо для связки ключей -->
      <circle cx="790" cy="312.5" r="90" fill="none" stroke="url(#ringSteel)" stroke-width="12"/>
      <circle cx="790" cy="312.5" r="84" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

      <!-- Черный пластиковый держатель с рукоятью -->
      <path d="M350 180 C 420 180, 710 260, 750 280 C 770 290, 770 335, 750 345 C 710 365, 420 445, 350 445 C 220 445, 200 180, 350 180 Z" fill="url(#holderBlack)" stroke="#475569" stroke-width="2"/>

      <!-- Отверстие под кольцо в рукоятке -->
      <circle cx="710" cy="312.5" r="22" fill="#FFFFFF"/>
      <circle cx="710" cy="312.5" r="22" fill="none" stroke="#334155" stroke-width="4"/>

      <!-- Стальная чаша таблетки iButton Dallas -->
      <!-- Внешнее кольцо держателя обоймы -->
      <circle cx="340" cy="312.5" r="115" fill="#1E293B" stroke="#475569" stroke-width="3"/>
      <!-- Металлическая окантовка капсулы -->
      <circle cx="340" cy="312.5" r="98" fill="url(#steelDisc)" stroke="#64748B" stroke-width="2"/>
      <!-- Изолирующее пластиковое кольцо -->
      <circle cx="340" cy="312.5" r="76" fill="none" stroke="#0F172A" stroke-width="4"/>
      <!-- Центральный контактный диск iButton -->
      <circle cx="340" cy="312.5" r="72" fill="url(#steelDisc)"/>
      <circle cx="330" cy="302" r="50" fill="#FFFFFF" opacity="0.25"/>

      <!-- Гравировка маркировки DS1990A -->
      <text x="340" y="305" font-family="'Courier New', monospace" font-size="14" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="2">DALLAS</text>
      <text x="340" y="325" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="1">DS1990A+</text>
    </g>
  </g>
</svg>