<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="crossUtilShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crossUtilContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Литейный цинковый сплав (матовый металлик) -->
    <linearGradient id="zincAlloy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="30%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="socketHole" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <g filter="url(#crossUtilShadow)">
    <g filter="url(#crossUtilContact)">
      <!-- Универсальный 4-лучевой ключ-крест для электрощитов (Knipex / Rittal) -->

      <!-- Горизонтальная перекладина креста -->
      <rect x="240" y="282.5" width="520" height="60" rx="12" fill="url(#zincAlloy)" stroke="#64748B" stroke-width="2"/>
      <line x1="250" y1="290" x2="750" y2="290" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>

      <!-- Вертикальная перекладина креста -->
      <rect x="470" y="70" width="60" height="485" rx="12" fill="url(#zincAlloy)" stroke="#64748B" stroke-width="2"/>
      <line x1="478" y1="80" x2="478" y2="545" stroke="#FFFFFF" stroke-width="3" opacity="0.8"/>

      <!-- Центральная ступица крестовины со сквозным квадратом 5 мм -->
      <circle cx="500" cy="312.5" r="55" fill="url(#zincAlloy)" stroke="#475569" stroke-width="2.5"/>
      <rect x="485" y="297.5" width="30" height="30" rx="4" fill="url(#socketHole)" stroke="#0F172A" stroke-width="2"/>

      <!-- ЛУЧ 1 (Левый торец): Внутренний трехгранник 8–9 мм -->
      <ellipse cx="240" cy="312.5" rx="18" ry="30" fill="url(#zincAlloy)" stroke="#475569" stroke-width="2"/>
      <polygon points="230,300 248,312.5 230,325" fill="url(#socketHole)" stroke="#0F172A" stroke-width="1.5"/>

      <!-- ЛУЧ 2 (Правый торец): Внутренний квадрат 7–8 мм -->
      <ellipse cx="760" cy="312.5" rx="18" ry="30" fill="url(#zincAlloy)" stroke="#475569" stroke-width="2"/>
      <rect x="748" y="300.5" width="22" height="24" rx="2" fill="url(#socketHole)" stroke="#0F172A" stroke-width="1.5"/>

      <!-- ЛУЧ 3 (Верхний торец): Ступенчатый квадрат 6–7–8 мм -->
      <ellipse cx="500" cy="70" rx="30" ry="16" fill="url(#zincAlloy)" stroke="#475569" stroke-width="2"/>
      <rect x="488" y="58" width="24" height="24" rx="2" fill="url(#socketHole)" stroke="#0F172A" stroke-width="1.5"/>

      <!-- ЛУЧ 4 (Нижний торец): Двубородковый ключ 3–5 мм (для щитков распределительных) -->
      <ellipse cx="500" cy="555" rx="30" ry="16" fill="url(#zincAlloy)" stroke="#475569" stroke-width="2"/>
      <circle cx="500" cy="555" r="10" fill="url(#socketHole)"/>
      <rect x="496" y="542" width="8" height="26" fill="url(#socketHole)"/>

      <!-- Тисненая маркировка на корпусе -->
      <text x="360" y="318" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#475569" letter-spacing="2" text-anchor="middle">UTILITY</text>
      <text x="640" y="318" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="#475569" letter-spacing="2" text-anchor="middle">4-WAY</text>
    </g>
  </g>
</svg>