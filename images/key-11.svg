<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="tubularShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tubularContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tubeMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="holeDepth" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="tubularBow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g filter="url(#tubularShadow)">
    <g filter="url(#tubularContact)">
      <!-- Полый цилиндрический стержень трубчатого ключа -->
      <rect x="230" y="275" width="380" height="75" rx="4" fill="url(#tubeMetal)" stroke="#64748B" stroke-width="2"/>
      <!-- Блик по верхней кромке цилиндра -->
      <line x1="235" y1="282" x2="610" y2="282" stroke="#FFFFFF" stroke-width="4" opacity="0.9"/>

      <!-- Радиальные продольные секретные пропилы на окружности трубки -->
      <rect x="230" y="290" width="45" height="6" fill="#334155"/>
      <rect x="230" y="305" width="65" height="7" fill="#1E293B"/>
      <rect x="230" y="322" width="30" height="6" fill="#334155"/>
      <rect x="230" y="336" width="55" height="7" fill="#1E293B"/>

      <!-- Центровочный фиксирующий выступ (Key tab) -->
      <rect x="260" y="265" width="25" height="10" rx="2" fill="url(#tubeMetal)" stroke="#64748B" stroke-width="1.5"/>

      <!-- Открытый торец полой трубки (показывающий полость и толщину стенок) -->
      <ellipse cx="230" cy="312.5" rx="18" ry="37.5" fill="url(#tubeMetal)" stroke="#64748B" stroke-width="2"/>
      <ellipse cx="230" cy="312.5" rx="12" ry="26" fill="url(#holeDepth)" stroke="#0F172A" stroke-width="2"/>

      <!-- Массивная головка трубчатого ключа с черным покрытием -->
      <circle cx="710" cy="312.5" r="105" fill="url(#tubularBow)" stroke="#475569" stroke-width="3"/>
      <circle cx="710" cy="312.5" r="92" fill="none" stroke="#64748B" stroke-width="2" opacity="0.5"/>

      <!-- Отверстие для ключного кольца -->
      <circle cx="760" cy="312.5" r="24" fill="#FFFFFF"/>
      <circle cx="760" cy="312.5" r="24" fill="none" stroke="#334155" stroke-width="3"/>

      <!-- Рельефная надпись CHICAGO / TUBULAR -->
      <text x="660" y="320" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#94A3B8" letter-spacing="3" text-anchor="middle">TUBULAR</text>
    </g>
  </g>
</svg>