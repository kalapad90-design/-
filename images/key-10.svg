<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="crossShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="crossContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Металл никелированный -->
    <linearGradient id="nickelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <g filter="url(#crossShadow)">
    <g filter="url(#crossContact)">
      <!-- Крестообразный стержень с 4 ребрами -->
      <!-- Верхнее ребро с зубьями -->
      <path d="M220 270 L250 262 L280 270 L320 260 L360 270 L410 258 L450 270 L510 260 L560 270 L600 270 L600 295 L220 295 Z" fill="url(#finGrad)" stroke="#64748B" stroke-width="1"/>

      <!-- Нижнее ребро с зубьями -->
      <path d="M220 330 L260 340 L300 330 L350 345 L400 330 L460 342 L500 330 L550 342 L580 330 L600 330 L600 355 L220 330 Z" fill="url(#finGrad)" stroke="#64748B" stroke-width="1"/>

      <!-- Центральный горизонтальный стержень с боковыми секретами -->
      <path d="M170 312.5 L220 290 L600 290 L600 335 L220 335 Z" fill="url(#nickelGrad)" stroke="#94A3B8" stroke-width="2"/>

      <!-- Боковые вырезы на центральном ребре -->
      <polygon points="260,290 280,290 295,302 275,302" fill="#475569"/>
      <polygon points="340,290 365,290 380,305 355,305" fill="#475569"/>
      <polygon points="430,290 450,290 465,300 445,300" fill="#475569"/>
      <polygon points="510,290 535,290 550,304 525,304" fill="#475569"/>

      <!-- Осевой блик крестового сердечника -->
      <line x1="210" y1="312.5" x2="600" y2="312.5" stroke="#FFFFFF" stroke-width="3"/>

      <!-- Характерный наконечник крестового ключа со звездочкой на торце -->
      <path d="M170 312.5 L200 290 L200 335 Z" fill="#94A3B8" stroke="#64748B" stroke-width="1.5"/>

      <!-- Круглая никелированная головка крестового ключа -->
      <circle cx="730" cy="312.5" r="115" fill="url(#nickelGrad)" stroke="#64748B" stroke-width="3"/>
      <circle cx="730" cy="312.5" r="102" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

      <!-- Отверстие в головке ключа -->
      <circle cx="780" cy="312.5" r="24" fill="#FFFFFF"/>
      <circle cx="780" cy="312.5" r="24" fill="none" stroke="#64748B" stroke-width="3"/>

      <!-- Тиснение бренда KALE / FAYE -->
      <text x="680" y="320" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#475569" letter-spacing="3" text-anchor="middle">CROSS</text>
    </g>
  </g>
</svg>