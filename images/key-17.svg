<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="masterShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="masterContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="masterBlade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="headMaster" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="masterDimple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>

  <g filter="url(#masterShadow)">
    <g filter="url(#masterContact)">
      <!-- Высокоточное лезвие ключа мастер-системы (EVVA / KABA / CISA) -->
      <path d="M170 312.5 L210 278 L600 278 L600 347 L210 347 Z" fill="url(#masterBlade)" stroke="#94A3B8" stroke-width="2"/>

      <!-- Продольный направляющий боковой паз с защитой от бампинга -->
      <path d="M210 295 L590 295" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
      <path d="M210 297 L590 297" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

      <!-- Многоуровневые конические лунки (Dimples) мастер-системы -->
      <!-- Верхний ряд лунок -->
      <ellipse cx="270" cy="318" rx="15" ry="12" fill="url(#masterDimple)" stroke="#CBD5E1" stroke-width="1"/>
      <ellipse cx="330" cy="318" rx="17" ry="13" fill="url(#masterDimple)" stroke="#CBD5E1" stroke-width="1"/>
      <ellipse cx="395" cy="318" rx="13" ry="10" fill="url(#masterDimple)" stroke="#CBD5E1" stroke-width="1"/>
      <ellipse cx="455" cy="318" rx="18" ry="14" fill="url(#masterDimple)" stroke="#CBD5E1" stroke-width="1"/>
      <ellipse cx="520" cy="318" rx="14" ry="11" fill="url(#masterDimple)" stroke="#CBD5E1" stroke-width="1"/>

      <!-- Интерактивный шариковый подпружиненный пин -->
      <circle cx="365" cy="286" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>
      <circle cx="490" cy="286" r="6" fill="#F59E0B" stroke="#B45309" stroke-width="1"/>

      <!-- Боковые наклонные лунки сложного профиля -->
      <ellipse cx="300" cy="336" rx="10" ry="6" fill="url(#masterDimple)"/>
      <ellipse cx="425" cy="336" rx="11" ry="7" fill="url(#masterDimple)"/>
      <ellipse cx="485" cy="336" rx="9" ry="5" fill="url(#masterDimple)"/>

      <!-- Синяя головка ключа мастер-системы с цветовой маркировкой уровня доступа -->
      <path d="M570 230 C 610 205, 760 195, 820 225 C 865 245, 875 365, 820 395 C 760 425, 610 415, 570 390 C 545 375, 540 345, 540 312.5 C 540 280, 545 250, 570 230 Z" fill="url(#headMaster)" stroke="#1D4ED8" stroke-width="2"/>

      <!-- Отверстие для ключного кольца -->
      <circle cx="800" cy="312.5" r="26" fill="#FFFFFF"/>
      <circle cx="800" cy="312.5" r="26" fill="none" stroke="#1E3A8A" stroke-width="4"/>

      <!-- Белый бейдж цветовой маркировки мастер-системы -->
      <rect x="635" y="275" width="100" height="75" rx="12" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="2"/>
      <text x="685" y="305" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#1D4ED8" text-anchor="middle">MASTER</text>
      <text x="685" y="325" font-family="'Arial', sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle">SYS #17</text>
    </g>
  </g>
</svg>