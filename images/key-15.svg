<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="motoShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="motoContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="motoBlade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="rubberGrip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <g filter="url(#motoShadow)">
    <g filter="url(#motoContact)">
      <!-- Лезвие мотоциклетного ключа с двухсторонней симметричной нарезкой (Honda/Yamaha) -->
      <!-- Верхний профиль с зубьями -->
      <path d="
        M160 312.5 L200 285 L240 285 L260 293 L290 285 L330 298 L370 285 L420 295 L460 285 L510 295 L550 285 L580 285
        L580 340 L550 340 L510 330 L460 340 L420 330 L370 340 L330 327 L290 340 L260 332 L240 340 L200 340 Z
      " fill="url(#motoBlade)" stroke="#94A3B8" stroke-width="1.5"/>

      <!-- Центральный направляющий паз лезвия -->
      <rect x="210" y="309" width="370" height="7" rx="3" fill="#64748B"/>
      <rect x="210" y="311" width="370" height="2" fill="#FFFFFF" opacity="0.8"/>

      <!-- Массивная рельефная резиновая рукоять мото-ключа с крыльями (форма эмблемы Honda) -->
      <path d="
        M560 240 C 600 215, 760 200, 810 220 C 850 235, 860 320, 850 355 C 830 400, 750 425, 600 410 C 560 395, 545 365, 545 312.5 C 545 260, 560 240, 560 240 Z
      " fill="url(#rubberGrip)" stroke="#475569" stroke-width="2"/>

      <!-- Резиновые ребристые насечки для сцепления в перчатках -->
      <line x1="600" y1="260" x2="600" y2="365" stroke="#334155" stroke-width="4"/>
      <line x1="620" y1="250" x2="620" y2="375" stroke="#334155" stroke-width="4"/>
      <line x1="640" y1="245" x2="640" y2="380" stroke="#334155" stroke-width="4"/>

      <!-- Отверстие для ключного кольца -->
      <circle cx="790" cy="312.5" r="25" fill="#FFFFFF"/>
      <circle cx="790" cy="312.5" r="25" fill="none" stroke="#334155" stroke-width="4"/>

      <!-- Стилизованный значок крыла / мотоцикла -->
      <path d="M680 300 Q 720 285, 750 300 Q 720 305, 680 300 Z" fill="#EF4444"/>
      <path d="M690 312 Q 725 305, 745 315 Q 720 318, 690 312 Z" fill="#EF4444"/>
      <path d="M700 324 Q 730 320, 740 327 Q 720 329, 700 324 Z" fill="#EF4444"/>
    </g>
  </g>
</svg>