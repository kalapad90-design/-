<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cardCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="silverBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <g filter="url(#cardShadow)">
    <g filter="url(#cardContact)">
      <!-- Тонкая ультрасовременная автомобильная ключ-карта (Renault Megane / Laguna hands-free) -->
      <rect x="230" y="150" width="540" height="325" rx="28" fill="url(#cardCase)" stroke="#475569" stroke-width="2.5"/>

      <!-- Металлическая вставка аварийного выкидного ключа (Emergency blade) на торце -->
      <path d="M230 180 L230 445 L255 445 L255 180 Z" fill="url(#silverBtn)" stroke="#64748B" stroke-width="1.5"/>
      <!-- Кнопка фиксатора аварийного ключа -->
      <circle cx="275" cy="205" r="8" fill="#64748B"/>

      <!-- Декоративная хромированная полоса карты -->
      <line x1="300" y1="165" x2="300" y2="460" stroke="#334155" stroke-width="3"/>

      <!-- Три круглые хромированные кнопки управления -->
      <!-- Кнопка 1: Закрыть (Lock) -->
      <circle cx="410" cy="312.5" r="42" fill="#1E293B" stroke="url(#silverBtn)" stroke-width="2.5"/>
      <svg x="394" y="296" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>

      <!-- Кнопка 2: Открыть (Unlock) -->
      <circle cx="525" cy="312.5" r="42" fill="#1E293B" stroke="url(#silverBtn)" stroke-width="2.5"/>
      <svg x="509" y="296" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
      </svg>

      <!-- Кнопка 3: Багажник (Trunk) -->
      <circle cx="640" cy="312.5" r="42" fill="#1E293B" stroke="url(#silverBtn)" stroke-width="2.5"/>
      <text x="640" y="318" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#CBD5E1" text-anchor="middle">HOLD</text>

      <!-- Светодиодный индикатор сигнала -->
      <circle cx="525" cy="235" r="4" fill="#38BDF8"/>
      <circle cx="525" cy="235" r="1.5" fill="#FFFFFF"/>

      <!-- Логотип / маркировка карты -->
      <text x="525" y="410" font-family="'Arial', sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="4" text-anchor="middle">HANDS FREE CARD</text>
    </g>
  </g>
</svg>