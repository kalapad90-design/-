<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="postShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset in="blur" dx="0" dy="22" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="postContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="postBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
  </defs>

  <g filter="url(#postShadow)">
    <g filter="url(#postContact)">
      <!-- Короткое аккуратное латунное лезвие почтового ключика (Eurolocks / Cam lock) -->
      <!-- Зубчатый нижний край почтового ключа -->
      <path d="
        M220 295 L560 295 L560 330 L500 330 L470 342 L440 330 L400 348 L370 332 L330 344 L300 330 L270 340 L240 325 L220 312.5 Z
      " fill="url(#postBrass)" stroke="#A16207" stroke-width="2"/>

      <!-- Продольный направляющий паз почтового ключика -->
      <line x1="240" y1="305" x2="550" y2="305" stroke="#A16207" stroke-width="4"/>
      <line x1="240" y1="307" x2="550" y2="307" stroke="#FEF08A" stroke-width="1.5" opacity="0.8"/>

      <!-- Классическая круглая латунная головка почтового ключа -->
      <circle cx="680" cy="312.5" r="120" fill="url(#postBrass)" stroke="#A16207" stroke-width="3"/>
      <circle cx="680" cy="312.5" r="105" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

      <!-- Отверстие для ключного кольца -->
      <circle cx="730" cy="312.5" r="26" fill="#FFFFFF"/>
      <circle cx="730" cy="312.5" r="26" fill="none" stroke="#A16207" stroke-width="3"/>

      <!-- Тиснение номера / почтового конверта -->
      <rect x="615" y="295" width="45" height="35" rx="4" fill="none" stroke="#854D0E" stroke-width="2.5"/>
      <polyline points="615,295 637.5,312 660,295" stroke="#854D0E" stroke-width="2" fill="none"/>
      <text x="637.5" y="350" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#854D0E" letter-spacing="1" text-anchor="middle">MAIL</text>
    </g>
  </g>
</svg>