<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="pumpShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pumpContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="pumpChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="80%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="teethCut" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <g filter="url(#pumpShadow)">
    <g filter="url(#pumpContact)">
      <!-- Торцевая рабочая часть помпового ключа со ступенчатыми нарезками (зубьями) -->
      <!-- Зубчатый торец с секретными выступами разной высоты -->
      <polygon points="
        160,265 190,265 190,278 175,278 175,290 200,290 200,305 165,305 165,320 185,320 185,335 170,335 170,345 200,345 200,360 160,360
        230,360 230,265
      " fill="url(#teethCut)" stroke="#475569" stroke-width="1.5"/>

      <!-- Массивный круглый стальной стержень помпового ключа -->
      <rect x="220" y="275" width="400" height="75" rx="3" fill="url(#pumpChrome)" stroke="#64748B" stroke-width="2"/>
      <line x1="220" y1="284" x2="620" y2="284" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>

      <!-- Боковые направляющие крылышки помпового замка -->
      <path d="M320 255 L355 255 L345 275 L330 275 Z" fill="url(#pumpChrome)" stroke="#64748B" stroke-width="1.5"/>
      <path d="M320 370 L355 370 L345 350 L330 350 Z" fill="url(#pumpChrome)" stroke="#64748B" stroke-width="1.5"/>

      <!-- Центральное переходное кольцо шейки -->
      <rect x="580" y="260" width="30" height="105" rx="6" fill="url(#pumpChrome)" stroke="#475569" stroke-width="2"/>

      <!-- Эргономичная массивная сейфовая головка ключа -->
      <rect x="610" y="210" width="220" height="205" rx="35" fill="url(#pumpChrome)" stroke="#64748B" stroke-width="3"/>
      <rect x="625" y="225" width="190" height="175" rx="25" fill="#1E293B" stroke="#334155" stroke-width="2"/>

      <!-- Центральное окно/отверстие головки сейфового ключа -->
      <rect x="670" y="260" width="100" height="105" rx="20" fill="#FFFFFF" stroke="#475569" stroke-width="3"/>

      <!-- Рельефная надпись MOTTURA PUMP -->
      <text x="720" y="245" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#94A3B8" letter-spacing="2" text-anchor="middle">SAFE PUMP</text>
    </g>
  </g>
</svg>