<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" fill="none">
  <!-- Чистый бесшовный белый фон -->
  <rect width="1000" height="625" fill="#FFFFFF"/>
  <defs>
    <filter id="leverShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset in="blur" dx="0" dy="24" result="offsetBlur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="leverContact" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="cblur"/>
      <feOffset in="cblur" dx="0" dy="8" result="coffset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="leverBrass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#FACC15"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    <linearGradient id="shaftNickel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <g filter="url(#leverShadow)">
    <g filter="url(#leverContact)">
      <!-- Бородка сувальдного ключа со ступенчатыми секретными пазами -->
      <!-- Верхнее крыло бородки -->
      <polygon points="
        210,215 235,215 235,230 255,230 255,245 280,245 280,225 305,225 305,255 330,255 330,285 210,285
      " fill="url(#shaftNickel)" stroke="#64748B" stroke-width="1.5"/>

      <!-- Нижнее симметричное крыло бородки -->
      <polygon points="
        210,340 330,340 330,370 305,370 305,400 280,400 280,380 255,380 255,395 235,395 235,410 210,410
      " fill="url(#shaftNickel)" stroke="#64748B" stroke-width="1.5"/>

      <!-- Длинный круглый стержень ключа -->
      <rect x="175" y="295" width="480" height="35" rx="17.5" fill="url(#shaftNickel)" stroke="#64748B" stroke-width="2"/>
      <line x1="180" y1="304" x2="655" y2="304" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>

      <!-- Направляющий носик стержня на конце -->
      <circle cx="175" cy="312.5" r="17.5" fill="url(#shaftNickel)" stroke="#64748B" stroke-width="1.5"/>

      <!-- Кольцевые декоративные упоры на шейке стержня -->
      <rect x="360" y="280" width="14" height="65" rx="4" fill="url(#shaftNickel)" stroke="#475569" stroke-width="1.5"/>
      <rect x="630" y="280" width="14" height="65" rx="4" fill="url(#shaftNickel)" stroke="#475569" stroke-width="1.5"/>

      <!-- Классическая изящная круглая головка сувальдного ключа -->
      <circle cx="750" cy="312.5" r="95" fill="url(#shaftNickel)" stroke="#64748B" stroke-width="3"/>
      <circle cx="750" cy="312.5" r="82" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>

      <!-- Центральное фигурное каплевидное отверстие в головке -->
      <circle cx="750" cy="312.5" r="45" fill="#FFFFFF"/>
      <circle cx="750" cy="312.5" r="45" fill="none" stroke="#64748B" stroke-width="2"/>
      <!-- Дополнительное отверстие для кольца -->
      <circle cx="810" cy="312.5" r="14" fill="#FFFFFF"/>
      <circle cx="810" cy="312.5" r="14" fill="none" stroke="#64748B" stroke-width="2"/>
    </g>
  </g>
</svg>